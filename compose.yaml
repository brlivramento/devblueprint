
services:
  app:
    container_name: devblueprint
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/devblueprint.db
      NOTION_TOKEN: ${NOTION_TOKEN}
      NOTION_PROJECTS_DATABASE_ID: ${NOTION_PROJECTS_DATABASE_ID}
    volumes:
      - devblueprint_data:/app/data
    restart: unless-stopped

volumes:
  devblueprint_data:
